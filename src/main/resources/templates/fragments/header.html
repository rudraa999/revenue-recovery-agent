    <!-- Script to toggle dropdown -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const menuBtn = document.getElementById('mobileMenuBtn');
            const drawer = document.getElementById('mobileDrawer');

            function toggleDrawer() {
                if (drawer.classList.contains('hidden')) {
                    drawer.classList.remove('hidden');
                    drawer.classList.add('flex');
                } else {
                    drawer.classList.add('hidden');
                    drawer.classList.remove('flex');
                }
            }

            if (menuBtn) menuBtn.addEventListener('click', toggleDrawer);

            // Close dropdown when clicking outside
            document.addEventListener('click', function (event) {
                if (!drawer.contains(event.target) && !menuBtn.contains(event.target)) {
                    drawer.classList.add('hidden');
                    drawer.classList.remove('flex');
                }
            });

            loadWishlistCount();
            loadCartCount();
        });

        function updateCartBadge(count) {
            const badge = document.getElementById('cart-badge');
            if (badge) {
                badge.innerText = count;
                if (count > 0) {
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        function loadCartCount() {
            fetch('/api/cart/count')
                .then(res => res.json())
                .then(data => {
                    updateCartBadge(data.count);
                })
                .catch(err => console.error('Error fetching cart count:', err));
        }

        function addToCartGlobal(productId, quantity) {
            fetch('/api/cart/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'productId=' + productId + '&quantity=' + (quantity || 1)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    updateCartBadge(data.cartCount);
                    alert("Added to cart successfully!");
                }
            });
        }

        function updateWishlistBadge(count) {
            const badge = document.getElementById('wishlist-badge');
            if (badge) {
                badge.innerText = count;
                if (count > 0) {
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        function loadWishlistCount() {
            fetch('/api/wishlist/count')
                .then(response => response.json())
                .then(data => {
                    updateWishlistBadge(data.count);
                })
                .catch(error => console.error('Error fetching wishlist count:', error));
        }



        function toggleWishlist(productId, buttonElement) {
            fetch('/wishlist/toggle?productId=' + productId, {
                method: 'POST'
            })
                .then(response => {
                    if (response.status === 401) {
                        window.location.href = '/login';
                        return null;
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && data.success) {
                        updateWishlistBadge(data.count);

                        const svg = buttonElement.querySelector('svg');
                        if (data.isAdded) {
                            buttonElement.classList.add('text-rose-500', 'bg-rose-50', 'border-rose-300');
                            buttonElement.classList.remove('text-gray-400');
                            svg.setAttribute('fill', 'currentColor');
                        } else {
                            buttonElement.classList.remove('text-rose-500', 'bg-rose-50', 'border-rose-300');
                            buttonElement.classList.add('text-gray-400');
                            svg.setAttribute('fill', 'none');

                            if (window.location.pathname === '/wishlist') {
                                const card = document.getElementById('wishlist-item-' + productId);
                                if (card) {
                                    card.remove();
                                    if (data.count === 0) {
                                        window.location.reload();
                                    }
                                }
                            }
                        }
                    }
                })
                .catch(error => console.error('Error toggling wishlist:', error));
        }
    </script>
