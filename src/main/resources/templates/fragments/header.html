    <!-- Script to toggle dropdown -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const menuBtn = document.getElementById('mobileMenuBtn');
            const drawer = document.getElementById('mobileDrawer');

            function toggleDrawer() {
                if (drawer.classList.contains('hidden')) {
                    drawer.classList.remove('hidden');
                    drawer.classList.add('flex');
                } else {
                    drawer.classList.add('hidden');
                    drawer.classList.remove('flex');
                }
            }

            if (menuBtn) menuBtn.addEventListener('click', toggleDrawer);

            // Close dropdown when clicking outside
            document.addEventListener('click', function (event) {
                if (!drawer.contains(event.target) && !menuBtn.contains(event.target)) {
                    drawer.classList.add('hidden');
                    drawer.classList.remove('flex');
                }
            });

            loadWishlistCount();
            loadCartCount();
        });

        function updateCartBadge(count) {
            const badge = document.getElementById('cart-badge');
            if (badge) {
                badge.innerText = count;
                if (count > 0) {
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        function loadCartCount() {
            fetch('/api/cart/count')
                .then(res => res.json())
                .then(data => {
                    updateCartBadge(data.count);
                })
                .catch(err => console.error('Error fetching cart count:', err));
        }

        function addToCartGlobal(productId, quantity) {
            fetch('/api/cart/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'productId=' + productId + '&quantity=' + (quantity || 1)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    updateCartBadge(data.cartCount);
                    alert("Added to cart successfully!");
                }
            });
        }

        function updateWishlistBadge(count) {
            const badge = document.getElementById('wishlist-badge');
            if (badge) {
                badge.innerText = count;
                if (count > 0) {
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        function loadWishlistCount() {
            fetch('/api/wishlist/count')
                .then(response => response.json())
                .then(data => {
                    updateWishlistBadge(data.count);
                })
                .catch(error => console.error('Error fetching wishlist count:', error));
        }



        // Notifications Handling
        const notifBtn = document.getElementById('notificationBtn');
        const notifDropdown = document.getElementById('notificationDropdown');
        const notifBadge = document.getElementById('notifBadge');
        const notifCountTag = document.getElementById('notifCountTag');
        const notifList = document.getElementById('notificationList');

        if (notifBtn && notifDropdown) {
            notifBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                notifDropdown.classList.toggle('hidden');
                loadNotifications();
            });

            document.addEventListener('click', (e) => {
                if (!notifDropdown.contains(e.target) && !notifBtn.contains(e.target)) {
                    notifDropdown.classList.add('hidden');
                }
            });
        }

        function loadNotifications() {
            fetch('/api/notifications')
                .then(r => r.json())
                .then(data => {
                    const count = data.unreadCount || 0;
                    if (count > 0) {
                        notifBadge.textContent = count;
                        notifBadge.classList.remove('hidden');
                        notifCountTag.textContent = count + ' New';
                    } else {
                        notifBadge.classList.add('hidden');
                        notifCountTag.textContent = 'All caught up';
                    }

                    if (data.notifications && data.notifications.length > 0) {
                        notifList.innerHTML = data.notifications.map(n => `
                            <div onclick="handleNotificationClick(${n.id}, '${n.actionUrl}')" class="p-3 hover:bg-rose-50/50 cursor-pointer transition flex items-start gap-3 ${!n.read ? 'bg-rose-50/20' : ''}">
                                <div class="w-8 h-8 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0 mt-0.5">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between">
                                        <h4 class="text-xs font-bold text-gray-900 truncate">${n.title}</h4>
                                        <span class="text-[10px] bg-rose-100 text-rose-700 px-1.5 py-0.2 rounded font-semibold">${n.badgeText || 'Offer'}</span>
                                    </div>
                                    <p class="text-[11px] text-gray-600 mt-0.5 line-clamp-2 leading-relaxed">${n.message}</p>
                                    <span class="text-[10px] text-rose-600 font-semibold mt-1 inline-block hover:underline">Claim Offer &rarr;</span>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        notifList.innerHTML = '<div class="py-6 text-center text-xs text-gray-400">No new notifications</div>';
                    }
                })
                .catch(e => console.error('Error fetching notifications:', e));
        }

        function handleNotificationClick(id, url) {
            fetch('/api/notifications/mark-read/' + id, { method: 'POST' })
                .then(() => {
                    if (url) window.location.href = url;
                });
        }

        function markAllNotificationsRead() {
            fetch('/api/notifications/mark-all-read', { method: 'POST' })
                .then(() => {
                    loadNotifications();
                });
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            loadNotifications();
        });
    </script>
