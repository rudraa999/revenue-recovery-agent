<!DOCTYPE html>

            font-family: 'Inter', sans-serif;
            background-color: #fcf9f9;

        h3,

        }

        .glass-card {

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05);
