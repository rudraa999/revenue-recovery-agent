<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Error - The Arts Arcade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .error-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }

        .error-code {
            font-size: 80px;
            font-weight: bold;
            color: #dc3545;
        }

        .error-message {
            font-size: 20px;
            margin-bottom: 30px;
            color: #6c757d;
        }
    </style>
</head>

<body>

    <div class="error-container">
        <div class="error-code" th:text="${errorCode != null ? errorCode : (status != null ? status : 'Oops!')}">Oops!</div>
        <div class="error-message" th:text="${errorMessage != null ? errorMessage : (message != null ? message : 'Something went wrong.')}">Something went wrong.</div>
        <a href="/" class="btn btn-primary btn-lg">Go to Home</a>
    </div>

</body>

</html>
