<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title
        th:text="${currentCategory != null ? currentCategory + ' Collection - The Arts Arcade' : 'Products - The Arts Arcade'}">
        Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf9f9;
        }

        h1,
        h2,
        h3,
        .serif-font {
            font-family: 'Playfair Display', serif;
        }

        /* Hidden scrollbar for horizontal subcategories */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .page-fade {
            animation: fadeIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Sticky Bar styling fixes */
        .glass-sticky {
            background-color: rgba(252, 249, 249, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>

<body class="bg-[#fcf9f9] min-h-screen flex flex-col text-gray-800">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: navbar}"></div>

    <!-- Main Content wrapper -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10 page-fade">

        <!-- Category Title Header -->
        <div
            class="mb-5 md:mb-6 text-center md:text-left flex flex-col md:flex-row md:items-end justify-between border-b pb-4 border-gray-100 relative">
            <div>
                <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 tracking-tight mb-1">
                    <span th:text="${currentCategory != null ? currentCategory : 'All Products'}">Collection</span>
                </h1>
                <p th:if="${currentCategory == 'Hand Painted Frames'}"
                    class="text-gray-600 text-sm md:text-lg font-medium tracking-wide mt-3 max-w-2xl leading-relaxed whitespace-pre-line">
                    Explore our meticulously handcrafted creations

                </p>
                <p th:unless="${currentCategory == 'Hand Painted Frames'}"
                    class="text-gray-500 text-sm md:text-base font-light tracking-wide mt-1">Explore our meticulously
                    handcrafted creations</p>
            </div>
            <!-- Premium Divider Accent line -->
            <div
                class="absolute bottom-[-1px] left-1/2 md:left-0 -translate-x-1/2 md:translate-x-0 w-24 md:w-32 h-0.5 bg-rose-400">
            </div>
        </div>

        <!-- Sticky Horizontal Filter Bar -->
        <div
            class="sticky top-0 z-30 bg-[#fcf9f9]/95 backdrop-blur-md py-3 -mx-4 px-4 sm:mx-0 sm:px-0 mb-8 border-b border-gray-100 shadow-[0_4px_20px_-15px_rgba(0,0,0,0.1)] transition-shadow duration-300">
            <div
                class="flex overflow-x-auto hide-scrollbar gap-2 md:gap-3 items-center pb-2 pt-1 touch-pan-x snap-x snap-mandatory">

                <!-- ALL Pill -->
                <a th:href="@{/products(category=${currentCategory})}"
                    th:classappend="${currentSubcategory == null or currentSubcategory == ''} ? 'bg-rose-500 text-white shadow-md' : 'bg-gray-100 text-gray-700 hover:bg-gray-200 border border-transparent'"
                    class="whitespace-nowrap px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 flex-shrink-0 cursor-pointer snap-start">
                    All
                </a>

                <!-- Dynamic Subcategory Pills -->
                <a th:each="sub : ${listSubcategories}"
                    th:href="@{/products(category=${currentCategory}, subcategory=${sub})}"
                    th:classappend="${currentSubcategory == sub} ? 'bg-rose-500 text-white shadow-md' : 'bg-gray-100 text-gray-700 hover:bg-gray-200 border border-transparent'"
                    class="whitespace-nowrap px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 flex-shrink-0 cursor-pointer capitalize snap-start"
                    th:text="${sub}">
                    Subcategory
                </a>

            </div>
        </div>

        <!-- Product Grid -->
        <div th:if="${not #lists.isEmpty(listProducts)}"
            class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6 pb-20 w-full items-stretch">
            <th:block th:each="product : ${listProducts}">
                <!-- Using uniform product card fragment -->
                <div th:replace="~{fragments/product-card :: product-card}"></div>
            </th:block>
        </div>

        <!-- Empty State UI -->
        <div th:if="${#lists.isEmpty(listProducts)}"
            class="flex flex-col items-center justify-center py-20 bg-white rounded-3xl border border-dashed border-gray-300 shadow-sm mt-8 mx-4 sm:mx-0">
            <span class="text-6xl mb-4 opacity-80">🔍</span>
            <h3 class="text-2xl font-bold text-gray-800 serif-font mb-2">No masterworks found</h3>
            <p class="text-gray-500 text-center max-w-md px-4 leading-relaxed font-light">We couldn't find any products
                in this specific category right now. Please check back later or modify your filter!</p>
            <a th:href="@{/products(category=${currentCategory})}"
                class="mt-8 px-8 py-3 bg-gradient-to-r from-rose-500 to-amber-500 text-white rounded-full font-bold hover:shadow-rose-500/30 hover:-translate-y-1 transition-all duration-300 shadow-lg">Clear
                Filters</a>
        </div>

    </main>

    <!-- Generic Footer Padding Space if required -->
    <div class="mt-auto h-20"></div>

</body>

</html>
