<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Your Wishlist - The Arts Arcade</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf9f9;
        }

        h1,
        h2,
        h3,
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>

<body class="text-gray-800 flex flex-col min-h-screen">
    <div th:replace="fragments/header :: navbar"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="flex flex-col md:flex-row md:items-baseline gap-4 mb-8 border-b border-rose-100 pb-4">
            <h2 class="text-4xl font-bold text-gray-900 serif-font">My Wishlist</h2>
            <p class="text-gray-500"><span th:text="${#lists.size(wishlists)}">0</span> items saved</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6 pb-20 w-full items-stretch" th:if="${!#lists.isEmpty(wishlists)}">
            <div th:each="item : ${wishlists}" th:id="'wishlist-item-' + ${item.product.id}"
                class="bg-white rounded-xl shadow-md hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 ease-in-out flex flex-col group overflow-hidden border border-gray-100 relative h-full">

                <div class="relative w-full aspect-square overflow-hidden rounded-t-xl bg-gray-100">
                    <a th:href="@{'/product/' + ${item.product.id}}" class="block h-full w-full">
                        <img th:src="${item.product.imageUrl}" th:alt="${item.product.name}"
                            class="w-full h-full object-cover object-center transform group-hover:scale-105 transition-transform duration-700 ease-out">
                    </a>

                    <button type="button" aria-label="Remove from Wishlist"
                        class="absolute top-3 right-3 bg-white p-2 rounded-full shadow-md text-rose-500 hover:bg-rose-50 transition-colors duration-200 z-20"
                        th:onclick="'toggleWishlist(' + ${item.product.id} + ', this)'" title="Remove Item">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 md:h-5 md:w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>

                    <div th:if="${item.product.category != null}"
                        class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-emerald-700 text-[10px] md:text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider shadow-sm z-10 border border-emerald-50">
                        <span th:text="${item.product.category}">Category</span>
                    </div>
                </div>

                <div class="px-4 pt-4 flex flex-col flex-1 relative bg-white border-t border-gray-50">
                    <div class="text-center flex-grow flex flex-col justify-start">
                        <a th:href="@{'/product/' + ${item.product.id}}"
                            class="block group-hover:text-rose-600 transition-colors">
                            <h3 class="text-sm sm:text-base md:text-lg font-bold text-gray-900 mb-1 serif-font leading-tight line-clamp-2"
                                th:text="${item.product.name}">Product Name</h3>
                        </a>
                        <p class="text-base sm:text-lg font-bold text-rose-600 mb-2" th:text="${'₹' + item.product.price}">₹0.00
                        </p>
                    </div>

                    <div class="px-4 pb-4 pt-2 bg-white shrink-0 mt-auto flex flex-col justify-end">
                        <a th:href="@{'https://wa.me/919822080206'(text=${'Hello, I would like to order ' + item.product.name})}"
                            target="_blank" rel="noopener noreferrer"
                            class="w-full bg-emerald-600 text-white py-2 md:py-2.5 px-1 md:px-3 rounded-xl hover:bg-emerald-700 transition duration-300 flex items-center justify-center gap-1 md:gap-1.5 text-[11px] sm:text-sm font-semibold shadow-md hover:shadow-lg transform active:scale-95 whitespace-nowrap m-0 mt-auto group/btn cursor-pointer">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="h-3.5 w-3.5 sm:h-4 sm:w-4 md:h-5 md:w-5 shrink-0 group-hover/btn:scale-110 transition-transform duration-300"
                                fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M11.996 0C5.372 0 0 5.374 0 12.002c0 2.126.552 4.192 1.602 6.01L.068 24l6.126-1.607a11.96 11.96 0 005.802 1.503h.003c6.626 0 12-5.374 12-12.002C24 5.385 18.623 0 11.996 0zm0 21.902a9.96 9.96 0 01-5.086-1.39l-.364-.216-3.774.99.999-3.676-.237-.377A9.973 9.973 0 012.003 12c0-5.518 4.49-10.002 10.003-10.002 5.514 0 10 4.484 10 10.002 0 5.518-4.486 10.002-10 10.002zm5.48-7.5c-.302-.15-1.782-.88-2.057-.98-.276-.102-.477-.15-.678.15-.202.302-.78 1.03-.956 1.23-.175.2-.35.226-.65.076-.28-.15-1.29-.476-2.45-1.516-.91-.81-1.52-1.81-1.7-2.112-.175-.302-.018-.466.13-.616.134-.136.302-.352.452-.528.15-.176.202-.302.302-.502.1-.2.05-.376-.026-.526-.075-.15-.678-1.63-.928-2.23-.243-.586-.49-.506-.678-.515-.175-.01-.376-.01-.577-.01-.2 0-.528.075-.804.376-.276.302-1.054 1.03-1.054 2.51 0 1.48 1.08 2.914 1.23 3.115.15.2 2.128 3.245 5.155 4.546.72.31 1.28.496 1.714.636.722.23 1.38.197 1.9.12.585-.088 1.782-.728 2.033-1.432.25-.704.25-1.306.175-1.432-.075-.126-.276-.202-.577-.352z" />
                            </svg>

                            <span class="truncate">Chat Now</span>

                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(wishlists)}"
            class="text-center py-20 bg-white rounded-2xl shadow-sm border border-gray-100 max-w-2xl mx-auto">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-300 mb-4" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
            </svg>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">Your wishlist is empty</h3>
            <p class="text-gray-500 mb-6 font-medium">Found something you like? Tap the heart icon to save it for later.
            </p>
            <a href="/"
                class="inline-block bg-rose-600 text-white px-8 py-3 rounded-xl font-semibold shadow-md hover:bg-rose-700 transition hover:-translate-y-0.5">Explore
                Collection</a>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
