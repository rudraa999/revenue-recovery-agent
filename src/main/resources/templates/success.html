<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Order Confirmed - The Arts Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f2d74e;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }
    </style>
</head>

<body class="bg-gray-50 overflow-hidden">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="min-h-[calc(100vh-64px)] flex items-center justify-center p-4 relative">
        <!-- Confetti Container -->
        <div id="confetti-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

        <div
            class="bg-white rounded-2xl shadow-2xl p-8 md:p-12 text-center max-w-lg w-full relative z-10 animate-fade-in-up">
            <div class="mb-8">
                <div
                    class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 transform hover:scale-110 transition duration-300">
                    <i class="fas fa-check text-5xl text-green-500"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Order Confirmed!</h1>
                <p class="text-gray-500 text-lg">Thank you for your purchase.</p>
            </div>

            <div class="bg-gray-50 rounded-xl p-6 mb-8 border border-gray-100">
                <p class="text-gray-600 mb-2">Your order has been placed successfully.</p>
                <p class="text-sm text-gray-400">You will receive a confirmation email shortly.</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/orders"
                    class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-indigo-700 bg-indigo-100 hover:bg-indigo-200 transition duration-300">
                    <i class="fas fa-box-open mr-2"></i> View My Orders
                </a>
                <a href="/"
                    class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 shadow-lg hover:shadow-xl transition duration-300">
                    Continue Shopping
                </a>
            </div>
        </div>
    </div>

    <script>
        // Simple confetti effect
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#EF476F', '#FFD166', '#06D6A0', '#118AB2', '#073B4C'];

            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.opacity = Math.random();
                container.appendChild(confetti);
            }
        }
        window.onload = createConfetti;
    </script>
</body>

</html>
