<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Signup - The Arts Arcade</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf9f9;
        }

        h1,
        h2,
        h3,
        .serif-font {
            font-family: 'Playfair Display', serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">
    <div th:replace="fragments/header :: navbar"></div>

    <div class="flex-grow flex items-center justify-center p-4 py-12 relative overflow-hidden text-gray-800">
        <!-- Abstract background elements -->
        <div
            class="absolute top-0 right-0 w-[500px] h-[500px] rounded-full bg-rose-200 mix-blend-multiply filter blur-3xl opacity-50 translate-x-1/3 -translate-y-1/3">
        </div>
        <div
            class="absolute bottom-0 left-0 w-[600px] h-[600px] rounded-full bg-emerald-100 mix-blend-multiply filter blur-3xl opacity-60 -translate-x-1/3 translate-y-1/3">
        </div>

        <div
            class="relative glass-panel rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] overflow-hidden max-w-4xl w-full flex flex-col md:flex-row-reverse border border-white">

            <!-- Right Side: Image -->
            <div class="hidden md:block w-1/2 relative bg-rose-100 overflow-hidden group">
                <img src="https://images.openai.com/static-rsc-3/bQhsK00AV9OkTdcIk9B4JBIEvS1hm1V1cMQojgUk8IUDkXr55o7QtHb-dDmlCcM5uPGlfHg5d9QNNFhTy35mqATpl0_JSmpJ46kLQJpoLWk?purpose=fullsize&v=1"
                    alt="Soft floral bouquet"
                    class="absolute inset-0 w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-1000 ease-in-out">

                <div class="absolute inset-0 bg-gradient-to-t from-gray-900/80 via-gray-900/40 to-transparent"></div>

                <div class="absolute bottom-0 left-0 w-full p-12 text-white">
                    <h2 class="text-5xl font-bold mb-4 serif-font leading-tight tracking-tight">Join Us</h2>
                    <p class="text-lg opacity-90 font-light max-w-sm">Start your premium floral journey today and
                        discover the perfect arrangements.</p>
                </div>
            </div>

            <!-- Left Side: Form -->
            <div class="w-full md:w-1/2 p-8 lg:p-12 bg-white/80 flex flex-col justify-center">

                <div class="text-center mb-10">
                    <div
                        class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-rose-50 text-rose-500 mb-4 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z"></path>
                            <path d="M12 12a9 9 0 0 0-9-9 9 9 0 0 0 18 0 9 9 0 0 0-9 9Z"></path>
                            <path d="M12 3v9"></path>
                        </svg>
                    </div>
                    <h3 class="text-3xl font-bold text-gray-900 serif-font">Create Account</h3>
                    <p class="text-gray-500 mt-2 font-medium">Sign up to get started.</p>
                </div>

                <div th:if="${error}"
                    class="bg-red-50 text-red-700 py-3 px-4 rounded-xl mb-6 text-sm font-medium border border-red-100 flex items-center gap-2"
                    role="alert">
                    <i class="fas fa-exclamation-circle text-red-500"></i> <span th:text="${error}">Error message</span>
                </div>

                <form th:action="@{/register}" th:object="${user}" method="post" class="space-y-5">

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-800">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" th:field="*{username}"
                                class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:bg-white focus:border-gray-800 focus:ring-1 focus:ring-gray-800 transition-all duration-300"
                                placeholder="Choose a username" required>
                        </div>
                        <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}"
                            class="text-red-500 text-xs italic mt-2 ml-1"></p>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-800">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" th:field="*{email}"
                                class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:bg-white focus:border-gray-800 focus:ring-1 focus:ring-gray-800 transition-all duration-300"
                                placeholder="Enter your email" required>
                        </div>
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                            class="text-red-500 text-xs italic mt-2 ml-1"></p>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-800">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" th:field="*{password}"
                                class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:bg-white focus:border-gray-800 focus:ring-1 focus:ring-gray-800 transition-all duration-300"
                                placeholder="Create a strong password" required>
                        </div>
                        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                            class="text-red-500 text-xs italic mt-2 ml-1"></p>
                    </div>

                    <button type="submit"
                        class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg shadow-rose-200 transition-all duration-300 transform hover:-translate-y-0.5 active:scale-95 text-lg mt-2">
                        Sign Up
                    </button>
                    <p class="text-xs text-gray-500 text-center mt-3 font-medium">
                        By signing up, you agree to our <a href="#"
                            class="text-rose-600 hover:underline transition-colors">Terms</a>
                        and <a href="#" class="text-rose-600 hover:underline transition-colors">Privacy Policy</a>.
                    </p>
                </form>

                <div class="mt-8 text-center border-t border-gray-100 pt-6">
                    <p class="text-gray-500 font-medium">Already have an account?
                        <a href="/login"
                            class="text-gray-800 hover:text-rose-600 font-bold ml-1 transition-colors underline decoration-2 underline-offset-4 decoration-gray-200 hover:decoration-rose-400">Sign
                            In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
