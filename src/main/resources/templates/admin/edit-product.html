<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Product - Admin</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans leading-normal tracking-normal relative">

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden lg:hidden"
        onclick="toggleSidebar()"></div>

    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <div id="sidebar"
            class="w-64 bg-gray-800 text-white flex-shrink-0 fixed inset-y-0 right-0 transform translate-x-full transition-transform duration-300 ease-in-out z-30 lg:relative lg:translate-x-0">
            <div class="p-6 flex justify-between items-center">
                <h1 class="text-2xl font-bold">Admin Panel</h1>

                <button onclick="toggleSidebar()" class="lg:hidden text-gray-300 hover:text-white">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <nav class="mt-2">
                <a href="/admin/dashboard" class="block py-2.5 px-6 hover:bg-gray-700 transition">Dashboard</a>
                <a href="/admin/products" class="block py-2.5 px-6 bg-gray-700 hover:bg-gray-700 transition">Manage
                    Products</a>
                <a href="/" class="block py-2.5 px-6 hover:bg-gray-700 transition">Back to Shop</a>
            </nav>

        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden w-full">

            <header class="flex justify-between items-center py-4 px-4 sm:px-6 bg-white border-b-4 border-indigo-600">

                <h2 class="text-xl sm:text-2xl font-bold text-gray-800">Edit Product</h2>

                <button onclick="toggleSidebar()"
                    class="text-gray-500 hover:text-indigo-600 focus:outline-none lg:hidden">
                    <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>

            </header>

            <main class="flex-1 overflow-y-auto bg-gray-100 p-4 sm:p-6">

                <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6">

                    <form th:action="@{/admin/products/edit/{id}(id=${product.id})}" th:object="${product}"
                        method="post" enctype="multipart/form-data">

                        <!-- Error Message -->
                        <div th:if="${errorMessage}"
                            class="mb-6 p-4 bg-red-100 border border-red-300 text-red-700 rounded">
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">

                            <div>
                                <label class="text-sm font-semibold">Product Name</label>
                                <input type="text" th:field="*{name}"
                                    class="w-full border rounded-lg px-3 py-2 mt-1 focus:ring-2 focus:ring-indigo-500"
                                    required>
                            </div>

                            <div>
                                <label class="text-sm font-semibold">Price</label>
                                <input type="text" th:field="*{price}" placeholder="e.g. 100 or 100 - 150"
                                    class="w-full border rounded-lg px-3 py-2 mt-1 focus:ring-2 focus:ring-indigo-500"
                                    required>
                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="text-sm font-semibold">Description</label>

                            <textarea th:field="*{description}" rows="4"
                                class="w-full border rounded-lg px-3 py-2 mt-1 focus:ring-2 focus:ring-indigo-500"
                                required></textarea>

                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="text-sm font-semibold">Category</label>
                                <input type="text" th:field="*{category}"
                                    class="w-full border rounded-lg px-3 py-2 mt-1 focus:ring-2 focus:ring-indigo-500"
                                    required>
                            </div>
                            <div>
                                <label class="text-sm font-semibold">Subcategory (Optional)</label>
                                <input type="text" th:field="*{subcategory}" placeholder="e.g. Scented, Decal"
                                    class="w-full border rounded-lg px-3 py-2 mt-1 focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>

                        <!-- Display Section -->
                        <div class="mb-4 bg-gray-50 border border-gray-100 rounded-lg p-4">
                            <h3 class="text-md font-semibold mb-3 text-gray-800">Display Settings <span class="text-xs text-gray-500 font-normal ml-2">(select only one)</span></h3>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-center">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" id="trending" th:field="*{trending}"
                                        class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                                    <label for="trending" class="text-sm font-medium text-gray-700">Show in
                                        Trending</label>
                                </div>
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" id="inCollection" th:field="*{inCollection}"
                                        class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                                    <label for="inCollection" class="text-sm font-medium text-gray-700">Show in Our
                                        Collection</label>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Display Priority
                                        Order</label>
                                    <input type="number" th:field="*{displayOrder}"
                                        class="w-full border border-gray-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-indigo-500 text-sm">
                                </div>
                            </div>
                        </div>

                        <div class="mb-6">
                            <label class="text-sm font-semibold">Update Product Images</label>
                            <div class="flex flex-col sm:flex-row gap-4 mt-2">
                                <div th:if="${product.imageUrls != null}"
                                    th:with="imageArray=${#strings.arraySplit(product.imageUrls, ',')}">
                                    <div class="flex gap-2 flex-wrap">
                                        <div th:each="imgUrl : ${imageArray}">
                                            <img th:src="${imgUrl}" class="h-20 w-20 object-cover rounded border">
                                        </div>
                                    </div>
                                </div>
                                <input type="file" name="imageFiles" multiple accept="image/*"
                                    class="border rounded-lg px-3 py-2 w-full">
                            </div>
                        </div>

                        <div class="flex justify-end gap-3">

                            <a href="/admin/products"
                                class="px-5 py-2 border rounded-lg text-gray-700 hover:bg-gray-100">
                                Cancel
                            </a>

                            <button type="submit"
                                class="px-5 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                                Save Changes
                            </button>

                        </div>

                    </form>

                </div>

            </main>

        </div>

    </div>

    <script>

        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebarOverlay");

        function toggleSidebar() {

            sidebar.classList.toggle("translate-x-full");
            overlay.classList.toggle("hidden");

        }

    </script>

</body>

</html>
