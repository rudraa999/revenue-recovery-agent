<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Manage Orders - Admin</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans leading-normal tracking-normal relative">

    <!-- Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden lg:hidden"
        onclick="toggleSidebar()"></div>

    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <div id="sidebar"
            class="w-64 bg-gray-800 text-white flex-shrink-0 fixed inset-y-0 right-0 transform translate-x-full transition-transform duration-300 ease-in-out z-30 lg:relative lg:translate-x-0 lg:left-0">

            <div class="p-6 flex justify-between items-center">
                <h1 class="text-2xl font-bold">Admin Panel</h1>

                <button onclick="toggleSidebar()" class="lg:hidden text-gray-300 hover:text-white">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <nav class="mt-6">
                <a href="/admin/dashboard" class="block py-2.5 px-6 hover:bg-gray-700 transition">
                    Dashboard
                </a>

                <a href="/admin/products" class="block py-2.5 px-6 hover:bg-gray-700 transition">
                    Manage Products
                </a>

                <a href="/admin/orders" class="block py-2.5 px-6 bg-gray-700 hover:bg-gray-700 transition">
                    Manage Orders
                </a>

                <a href="/" class="block py-2.5 px-6 hover:bg-gray-700 transition">
                    Back to Shop
                </a>

                <form th:action="@{/logout}" method="post" class="px-6 mt-6">
                    <button type="submit"
                        class="w-full text-left py-2.5 px-4 rounded bg-red-600 hover:bg-red-700 text-white transition">
                        Logout
                    </button>
                </form>

            </nav>
        </div>

        <!-- Main -->
        <div class="flex-1 flex flex-col overflow-hidden w-full">

            <header class="flex justify-between items-center py-4 px-4 sm:px-6 bg-white border-b-4 border-indigo-600">

                <h2 class="text-xl sm:text-2xl font-bold">Order Management</h2>

                <div class="flex items-center gap-4">

                    <span class="text-gray-800 text-sm font-semibold hidden sm:block">
                        Welcome, Admin
                    </span>

                    <button onclick="toggleSidebar()"
                        class="text-gray-500 hover:text-indigo-600 focus:outline-none lg:hidden">

                        <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>

                    </button>

                </div>

            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-200 p-4 sm:p-6">

                <!-- Success Message -->
                <div th:if="${param.success}"
                    class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
                    <strong>Success!</strong>
                    <span>Order status updated successfully.</span>
                </div>

                <!-- Table -->
                <div class="bg-white shadow-md rounded-lg overflow-x-auto">

                    <table class="min-w-full leading-normal">

                        <thead>
                            <tr>

                                <th
                                    class="px-5 py-3 border-b bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Order ID
                                </th>

                                <th
                                    class="px-5 py-3 border-b bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    User
                                </th>

                                <th
                                    class="px-5 py-3 border-b bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Address
                                </th>

                                <th
                                    class="px-5 py-3 border-b bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Date
                                </th>

                                <th
                                    class="px-5 py-3 border-b bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Total
                                </th>

                                <th
                                    class="px-5 py-3 border-b bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Status
                                </th>

                                <th
                                    class="px-5 py-3 border-b bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Action
                                </th>

                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="order : ${orders}">

                                <td class="px-5 py-5 border-b bg-white text-sm" th:text="${order.id}">
                                </td>

                                <td class="px-5 py-5 border-b bg-white text-sm"
                                    th:text="${order.user != null ? order.user.username : 'Unknown'}">
                                </td>

                                <td class="px-5 py-5 border-b bg-white text-sm">

                                    <div th:if="${order.address != null}" class="text-xs text-gray-700">

                                        <div class="font-semibold" th:text="${order.address.fullName}">
                                        </div>

                                        <div th:text="${order.address.streetAddress}"></div>

                                        <div
                                            th:text="${order.address.city + ', ' + order.address.state + ' ' + order.address.zipCode}">
                                        </div>

                                        <div class="mt-1" th:text="${'📞 ' + order.address.phoneNumber}">
                                        </div>

                                    </div>

                                    <span th:if="${order.address == null}" class="text-gray-400 italic text-xs">
                                        No address provided
                                    </span>

                                </td>

                                <td class="px-5 py-5 border-b bg-white text-sm"
                                    th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">
                                </td>

                                <td class="px-5 py-5 border-b bg-white text-sm" th:text="${'₹' + order.totalAmount}">
                                </td>

                                <td class="px-5 py-5 border-b bg-white text-sm">

                                    <span th:text="${order.status}" th:class="${'px-2 inline-flex text-xs font-semibold rounded-full ' +
(order.status == 'PENDING' ? 'bg-yellow-100 text-yellow-800' :
(order.status == 'DELIVERED' ? 'bg-green-100 text-green-800' :
(order.status == 'CANCELLED' ? 'bg-red-100 text-red-800' :
'bg-blue-100 text-blue-800')))}">
                                    </span>

                                </td>

                                <td class="px-5 py-5 border-b bg-white text-sm">

                                    <form th:action="@{/admin/orders/update-status}" method="post"
                                        class="flex flex-col sm:flex-row gap-2">

                                        <input type="hidden" name="orderId" th:value="${order.id}">

                                        <select name="status" class="border rounded px-2 py-1 text-sm">

                                            <option value="PENDING" th:selected="${order.status == 'PENDING'}">PENDING
                                            </option>
                                            <option value="SHIPPED" th:selected="${order.status == 'SHIPPED'}">SHIPPED
                                            </option>
                                            <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">
                                                DELIVERED</option>
                                            <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">
                                                CANCELLED</option>

                                        </select>

                                        <button type="submit"
                                            class="bg-indigo-600 text-white px-3 py-1 rounded hover:bg-indigo-700 text-sm">
                                            Update
                                        </button>

                                    </form>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </main>

        </div>

    </div>

    <script>

        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebarOverlay");

        function toggleSidebar() {
            sidebar.classList.toggle("translate-x-full");
            overlay.classList.toggle("hidden");
        }

    </script>

</body>

</html>
```
