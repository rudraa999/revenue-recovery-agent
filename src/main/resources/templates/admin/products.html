<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Manage Products - Admin</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans leading-normal tracking-normal relative">

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-20 hidden lg:hidden"
        onclick="toggleSidebar()"></div>

    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <div id="sidebar"
            class="w-64 bg-gray-800 text-white flex-shrink-0 absolute inset-y-0 right-0 transform translate-x-full transition-transform duration-300 ease-in-out z-30 lg:relative lg:translate-x-0 lg:right-auto">

            <div class="p-6 flex justify-between items-center">
                <h1 class="text-2xl font-bold">Admin Panel</h1>

                <!-- Close button mobile -->
                <button onclick="toggleSidebar()" class="lg:hidden text-gray-300 hover:text-white">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <nav class="mt-6">
                <a href="/admin/dashboard" class="block py-2.5 px-6 transition duration-200 hover:bg-gray-700">
                    Dashboard
                </a>

                <a href="/admin/products"
                    class="block py-2.5 px-6 transition duration-200 hover:bg-gray-700 bg-gray-700">
                    Manage Products
                </a>

                <a href="/" class="block py-2.5 px-6 transition duration-200 hover:bg-gray-700">
                    Back to Shop
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden w-full">

            <!-- Header -->
            <header class="flex justify-between items-center py-4 px-4 sm:px-6 bg-white border-b-4 border-indigo-600">

                <h2 class="text-xl sm:text-2xl font-bold">Product Management</h2>

                <!-- Mobile Menu Button -->
                <button onclick="toggleSidebar()"
                    class="text-gray-500 hover:text-indigo-600 focus:outline-none lg:hidden">
                    <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>

            </header>

            <!-- Page Content -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-200 p-4 sm:p-6">

                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-4">
                    <h2 class="text-2xl font-bold text-gray-800">All Products</h2>

                    <a href="/admin/products/add"
                        class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 text-center">
                        Add New Product
                    </a>
                </div>

                <!-- Table Container -->
                <div class="bg-white shadow-md rounded-lg overflow-x-auto">

                    <table class="min-w-full leading-normal">

                        <thead>
                            <tr>
                                <th
                                    class="px-5 py-3 border-b-2 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    ID</th>
                                <th
                                    class="px-5 py-3 border-b-2 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Image</th>
                                <th
                                    class="px-5 py-3 border-b-2 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Name</th>
                                <th
                                    class="px-5 py-3 border-b-2 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Price</th>
                                <th
                                    class="px-5 py-3 border-b-2 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Category</th>
                                <th
                                    class="px-5 py-3 border-b-2 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Display Rank</th>
                                <th
                                    class="px-5 py-3 border-b-2 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Trending</th>
                                <th
                                    class="px-5 py-3 border-b-2 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase">
                                    Actions</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="product : ${products}">

                                <td class="px-5 py-5 border-b bg-white text-sm" th:text="${product.id}"></td>

                                <td class="px-5 py-5 border-b bg-white text-sm">
                                    <img th:src="${product.imageUrl}" class="h-10 w-10 rounded-full">
                                </td>

                                <td class="px-5 py-5 border-b bg-white text-sm" th:text="${product.name}"></td>

                                <td class="px-5 py-5 border-b bg-white text-sm" th:text="'₹' + ${product.price}"></td>

                                <td class="px-5 py-5 border-b bg-white text-sm" th:text="${product.category}"></td>

                                <td class="px-5 py-5 border-b bg-white text-sm" th:text="${product.displayOrder}"></td>

                                <td class="px-5 py-5 border-b bg-white text-sm">
                                    <span th:if="${product.trending}"
                                        class="px-2 inline-flex text-xs font-semibold rounded-full bg-green-100 text-green-800">
                                        Yes
                                    </span>

                                    <span th:unless="${product.trending}"
                                        class="px-2 inline-flex text-xs font-semibold rounded-full bg-gray-100 text-gray-800">
                                        No
                                    </span>
                                </td>

                                <td class="px-5 py-5 border-b bg-white text-sm">

                                    <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                                        class="text-indigo-600 hover:text-indigo-900 mr-3">
                                        Edit
                                    </a>

                                    <a th:href="@{/admin/products/delete/{id}(id=${product.id})}"
                                        class="text-red-600 hover:text-red-900"
                                        onclick="return confirm('Are you sure?')">
                                        Delete
                                    </a>

                                </td>

                            </tr>
                        </tbody>

                    </table>

                </div>

            </main>

        </div>

    </div>

    <script>

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {

            sidebar.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');

        }

    </script>

</body>

</html>
