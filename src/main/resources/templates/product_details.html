<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${product.name} + ' - The Arts Arcade'">Product Details</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf9f9;
        }

        h1,
        h2,
        h3,
        .serif-font {
            font-family: 'Playfair Display', serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05);
        }

        @media (min-width: 768px) {
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }

            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
    </style>
</head>

<body class="text-gray-800 flex flex-col min-h-screen">

    <div th:replace="fragments/header :: navbar"></div>

    <div class="max-w-7xl mx-auto md:px-4 sm:px-6 lg:px-8 py-0 md:py-12 flex-grow">
        <nav class="flex mt-4 md:mt-0 mb-4 md:mb-8 px-4 md:px-0 text-sm text-gray-500 font-medium">
            <a th:href="@{/}" class="hover:text-rose-600 transition-colors flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                    <path
                        d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                </svg>
                Home
            </a>
            <span class="mx-2 text-gray-300">/</span>
            <a th:href="@{/products(category=${product.category})}" class="hover:text-rose-600 transition-colors"
                th:text="${product.category}">Category</a>
            <span class="mx-2 text-gray-300">/</span>
            <span class="text-gray-800" th:text="${product.name}">Product Name</span>
        </nav>

        <div
            class="glass-card rounded-none md:rounded-3xl md:overflow-hidden shadow-2xl border-t border-white p-0 md:p-12 flex flex-col md:flex-row gap-4 md:gap-10 relative">

            <div class="w-full md:w-1/2 flex flex-col gap-6 relative">

                <div th:if="${product.imageUrls != null}"
                    th:with="imageArray=${#strings.arraySplit(product.imageUrls, ',')}"
                    class="md:hidden flex overflow-x-auto snap-x snap-mandatory w-full h-[400px] pb-2">
                    <div th:each="imgUrl : ${imageArray}" class="w-full h-full shrink-0 snap-center relative">
                        <div class="absolute inset-0 bg-rose-50/30"></div>
                        <img th:src="${imgUrl}" th:alt="${product.name}"
                            class="w-full h-full object-cover relative z-10" />
                    </div>
                </div>

                <div class="!hidden md:!flex flex-col items-center gap-6">
                    <div class="w-full flex justify-center bg-rose-50/30 rounded-2xl p-4 border border-rose-100/50">
                        <img th:if="${product.imageUrls != null}"
                            th:with="imageArray=${#strings.arraySplit(product.imageUrls, ',')}"
                            th:src="${imageArray[0]}" th:alt="${product.name}" id="mainProductImage"
                            class="w-full max-h-[500px] object-cover rounded-xl shadow-md transition-all duration-300">
                    </div>

                    <div th:if="${product.imageUrls != null}"
                        th:with="imageArray=${#strings.arraySplit(product.imageUrls, ',')}"
                        class="flex gap-4 overflow-x-auto py-2 w-full justify-center no-scrollbar">
                        <img th:each="imgUrl, iterStat : ${imageArray}" th:src="${imgUrl}"
                            th:alt="${product.name} + ' thumbnail ' + ${iterStat.count}"
                            onclick="document.getElementById('mainProductImage').src = this.src; document.querySelectorAll('.thumbnail-img').forEach(el => el.classList.remove('ring-4', 'ring-emerald-500', 'opacity-100')); this.classList.add('ring-4', 'ring-emerald-500', 'opacity-100'); document.querySelectorAll('.thumbnail-img').forEach(el => { if(el !== this) el.classList.add('opacity-60') });"
                            th:class="${iterStat.first ? 'thumbnail-img w-20 h-20 md:w-24 md:h-24 object-cover rounded-xl cursor-pointer shadow-sm transition-all duration-300 ring-4 ring-emerald-500 opacity-100' : 'thumbnail-img w-20 h-20 md:w-24 md:h-24 object-cover rounded-xl cursor-pointer shadow-sm transition-all duration-300 opacity-60 hover:opacity-100'}">
                    </div>
                </div>

                <div class="hidden md:flex flex-col mt-2 space-y-4 w-full">
                    <div class="flex gap-3 w-full">
                        <button type="button" th:onclick="'addToCartGlobal(' + ${product.id} + ')'"
                            class="flex-1 bg-white border-2 border-rose-600 text-rose-600 py-3.5 px-6 rounded-xl hover:bg-rose-50 transition-all duration-300 font-bold text-base shadow-sm flex items-center justify-center gap-2 cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                            </svg>
                            Add to Cart
                        </button>
                        
                        <form th:action="@{/checkout/buy-now}" method="post" class="flex-1">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <button type="submit"
                                class="w-full bg-rose-600 text-white py-3.5 px-6 rounded-xl hover:bg-rose-700 transition-all duration-300 font-bold text-base shadow-lg shadow-rose-200 flex items-center justify-center gap-2 cursor-pointer">
                                <span>Buy Now</span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                </svg>
                            </button>
                        </form>

                        <button type="button" aria-label="Add to Wishlist"
                            class="w-14 h-14 flex items-center justify-center rounded-xl border-2 border-emerald-200 text-emerald-600 hover:border-emerald-300 hover:text-emerald-700 hover:bg-emerald-50 transition-all duration-300 bg-white shadow-sm shrink-0 cursor-pointer"
                            th:onclick="'toggleWishlist(' + ${product.id} + ', this)'">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                            </svg>
                        </button>
                    </div>

                </div>
            </div>

            <div class="w-full md:w-1/2 flex flex-col justify-start pt-4 px-4 md:px-0 pb-6 md:pb-0 relative">

                <div class="relative w-full flex flex-col">

                    <div class="mb-2 md:mb-4">
                        <a th:href="@{/products(category=${product.category})}"
                            class="text-xs font-bold px-3 py-1 bg-rose-100 text-rose-800 rounded-full uppercase tracking-wider inline-block hover:bg-rose-200 transition-colors"
                            th:text="${product.category}">Category</a>
                    </div>

                    <h1 class="text-3xl md:text-5xl font-bold text-gray-900 mb-2 md:mb-4 serif-font leading-tight"
                        th:text="${product.name}">Product Name</h1>

                    <div class="flex items-baseline gap-4 mb-3 md:mb-6 border-b border-gray-100 pb-3 md:pb-6">
                        <p class="text-3xl md:text-4xl text-emerald-600 font-bold tracking-tight"
                            th:text="'₹' + ${product.price}">₹0.00</p>
                    </div>

                    <p class="text-gray-600 mb-4 md:mb-8 mt-1 leading-relaxed font-light text-base md:text-lg whitespace-pre-wrap"
                        th:text="${product.description}">Product description goes here.</p>

                    <div
                        class="md:hidden sticky bottom-0 z-[99] py-3 -mx-4 px-4 bg-white/95 backdrop-blur-md border-t border-gray-100 shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
                        <div class="flex gap-2 w-full">
                            <button type="button" th:onclick="'addToCartGlobal(' + ${product.id} + ')'"
                                class="flex-1 bg-white border border-rose-600 text-rose-600 py-2.5 px-3 rounded-xl font-bold text-xs shadow-sm flex items-center justify-center gap-1 cursor-pointer">
                                🛒 Add
                            </button>
                            <form th:action="@{/checkout/buy-now}" method="post" class="flex-1">
                                <input type="hidden" name="productId" th:value="${product.id}">
                                <button type="submit"
                                    class="w-full bg-rose-600 text-white py-2.5 px-3 rounded-xl font-bold text-xs shadow-md flex items-center justify-center gap-1 cursor-pointer">
                                    ⚡ Buy Now
                                </button>
                            </form>
                            <button type="button" aria-label="Add to Wishlist"
                                class="w-[42px] h-[42px] flex items-center justify-center rounded-xl border border-emerald-200 text-emerald-600 active:bg-emerald-50 transition-colors bg-white shrink-0 cursor-pointer"
                                th:onclick="'toggleWishlist(' + ${product.id} + ', this)'">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
